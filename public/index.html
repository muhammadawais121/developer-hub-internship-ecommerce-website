<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand — Global eCommerce Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#dbeafe;
  --accent:#f59e0b;--accent-dark:#d97706;
  --success:#059669;--danger:#dc2626;--warning:#f59e0b;
  --bg:#f8fafc;--white:#fff;--text:#0f172a;--text2:#64748b;--text3:#94a3b8;
  --border:#e2e8f0;--border2:#cbd5e1;
  --radius:10px;--radius-sm:6px;--radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);
  --shadow-xl:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;font-family:inherit;font-size:inherit}
img{max-width:100%;display:block}
input,select,textarea{font-family:inherit;font-size:14px;outline:none}
.container{max-width:1240px;margin:0 auto;padding:0 20px}
.btn{padding:10px 24px;border-radius:var(--radius-sm);font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-accent{background:var(--accent);color:#fff}.btn-accent:hover{background:var(--accent-dark)}
.btn-success{background:var(--success);color:#fff}
.btn-outline{border:1px solid var(--border);background:var(--white);color:var(--text)}.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:6px 14px;font-size:12px;border-radius:var(--radius-sm)}
.btn-lg{padding:14px 32px;font-size:16px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px}
.badge-danger{background:#fef2f2;color:var(--danger)}.badge-success{background:#ecfdf5;color:var(--success)}
.badge-warning{background:#fffbeb;color:var(--accent-dark)}.badge-info{background:var(--primary-light);color:var(--primary)}
.section-title{font-size:24px;font-weight:700;margin-bottom:24px;letter-spacing:-.3px}
.card{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;transition:all .25s ease}
.card:hover{box-shadow:var(--shadow-md);border-color:var(--border2)}

/* === TOP BAR === */
.top-bar{background:var(--text);color:rgba(255,255,255,.8);font-size:12px;padding:6px 0}
.top-bar .container{display:flex;justify-content:space-between;align-items:center}
.top-bar a{color:rgba(255,255,255,.8);transition:color .2s}.top-bar a:hover{color:#fff}
.top-bar-right{display:flex;gap:16px;align-items:center}

/* === HEADER === */
.header{background:var(--white);position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm)}
.header-main{height:70px;display:flex;align-items:center;gap:24px}
.logo{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:700;cursor:pointer;letter-spacing:-.5px}
.logo svg{flex-shrink:0}
.search-wrap{flex:1;max-width:580px}
.search-bar{display:flex;border:2px solid var(--primary);border-radius:var(--radius);overflow:hidden;background:var(--white)}
.search-bar select{border:none;background:var(--bg);padding:10px 14px;border-right:1px solid var(--border);min-width:140px;font-size:13px;color:var(--text2);font-weight:500}
.search-bar input{flex:1;border:none;padding:10px 16px;font-size:14px}
.search-bar button{background:var(--primary);color:#fff;padding:10px 22px;display:flex;align-items:center}
.search-bar button:hover{background:var(--primary-dark)}
.header-actions{display:flex;gap:6px;align-items:center}
.header-action{display:flex;flex-direction:column;align-items:center;padding:8px 14px;border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;position:relative;color:var(--text2)}
.header-action:hover{background:var(--bg);color:var(--primary)}
.header-action svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.header-action span{font-size:11px;margin-top:2px;font-weight:500}
.header-action .notif{position:absolute;top:2px;right:8px;background:var(--danger);color:#fff;font-size:9px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}

/* === NAV === */
.nav-bar{height:44px;background:var(--white);border-bottom:1px solid var(--border)}
.nav-bar .container{display:flex;align-items:center;justify-content:space-between}
.nav-links{display:flex;gap:28px;align-items:center}
.nav-links a{font-size:13px;color:var(--text2);font-weight:500;transition:color .2s;white-space:nowrap;display:flex;align-items:center;gap:4px}
.nav-links a:hover{color:var(--primary)}
.nav-links .cat-link{color:var(--primary);font-weight:600}
.nav-right{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--text2)}

/* === HERO === */
.hero{display:grid;grid-template-columns:240px 1fr 290px;gap:0;margin-top:1px;min-height:380px;background:var(--white);border-radius:0 0 var(--radius) var(--radius);overflow:hidden;border:1px solid var(--border)}
.hero-sidebar{background:var(--white);padding:6px 0;border-right:1px solid var(--border)}
.hero-cat-item{padding:11px 18px;cursor:pointer;font-size:13px;font-weight:500;display:flex;align-items:center;gap:12px;transition:all .15s;color:var(--text)}
.hero-cat-item:hover,.hero-cat-item.active{background:var(--primary-light);color:var(--primary)}
.hero-cat-item img{width:28px;height:28px;border-radius:6px;object-fit:cover}
.hero-center{position:relative;overflow:hidden;display:flex;align-items:center}
.hero-bg{position:absolute;inset:0;background:linear-gradient(135deg,#e0f2fe,#dbeafe,#ede9fe);z-index:0}
.hero-content{position:relative;z-index:2;padding:48px 40px;max-width:380px}
.hero-tag{display:inline-block;background:var(--primary);color:#fff;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:12px;letter-spacing:.5px}
.hero-content h1{font-size:36px;font-weight:700;line-height:1.15;margin-bottom:10px;letter-spacing:-.5px}
.hero-content p{color:var(--text2);margin-bottom:20px;font-size:15px;line-height:1.6}
.hero-slider{position:absolute;right:0;top:0;bottom:0;width:55%;z-index:1;overflow:hidden}
.hero-slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;transition:opacity .8s ease;pointer-events:none}
.hero-slide.active{opacity:1;pointer-events:auto}
.hero-slide img{border-radius:var(--radius-lg);object-fit:cover;box-shadow:var(--shadow-xl)}
.hero-slide img.main-slide{width:280px;height:340px}
.hero-slide img.side-slide{width:160px;height:220px;position:absolute}
.hero-slide img.side-l{left:10px;bottom:30px;transform:rotate(-4deg);opacity:.7}
.hero-slide img.side-r{right:10px;top:30px;transform:rotate(3deg);opacity:.6}
.hero-dots{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:8px}
.hero-dots span{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer;transition:all .3s}
.hero-dots span.active{background:#fff;width:28px;border-radius:5px}
.hero-right{background:var(--white);border-left:1px solid var(--border);padding:20px;display:flex;flex-direction:column;gap:12px}
.user-card{text-align:center;padding:20px 16px;border:1px solid var(--border);border-radius:var(--radius)}
.user-card .avatar{width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:20px;font-weight:700}
.user-card h4{font-size:15px;margin-bottom:2px}
.user-card p{font-size:12px;color:var(--text2);margin-bottom:12px}
.user-card .btns{display:flex;gap:8px;justify-content:center}
.promo-card{padding:18px;border-radius:var(--radius);color:#fff;position:relative;overflow:hidden}
.promo-card h4{font-size:15px;font-weight:700;margin-bottom:4px}
.promo-card p{font-size:12px;opacity:.9}
.promo-card .promo-icon{position:absolute;right:10px;bottom:10px;font-size:40px;opacity:.3}
.promo-card.orange{background:linear-gradient(135deg,#f97316,#f59e0b)}
.promo-card.teal{background:linear-gradient(135deg,#0d9488,#06b6d4)}

/* === DEALS === */
.deals-section{padding:36px 0}
.deals-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.deals-head h2{font-size:24px;font-weight:700}
.deals-head p{font-size:13px;color:var(--text2)}
.countdown{display:flex;gap:6px;margin-top:10px}
.countdown-box{background:var(--text);color:#fff;padding:8px 12px;border-radius:var(--radius-sm);text-align:center;font-size:15px;font-weight:700;min-width:54px;font-variant-numeric:tabular-nums}
.countdown-box small{display:block;font-size:10px;font-weight:400;opacity:.7;text-transform:uppercase;letter-spacing:.5px}
.deals-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.deal-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.deal-card:hover{box-shadow:var(--shadow-md);transform:translateY(-3px)}
.deal-card .img-wrap{width:100%;height:140px;border-radius:var(--radius-sm);overflow:hidden;margin-bottom:10px;background:var(--bg)}
.deal-card .img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.deal-card:hover .img-wrap img{transform:scale(1.05)}
.deal-card .name{font-size:13px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deal-card .price{font-size:15px;font-weight:700;color:var(--primary)}
.deal-card .badge{position:absolute;top:10px;right:10px;background:var(--danger);color:#fff;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700}

/* === CATEGORY SECTION === */
.cat-section{padding:28px 0}
.cat-layout{display:grid;grid-template-columns:260px 1fr;gap:20px}
.cat-banner{border-radius:var(--radius);padding:36px 30px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;position:relative;overflow:hidden;min-height:340px}
.cat-banner::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.6));z-index:1}
.cat-banner-bg{position:absolute;inset:0}
.cat-banner-bg img{width:100%;height:100%;object-fit:cover}
.cat-banner-content{position:relative;z-index:2}
.cat-banner h3{font-size:22px;font-weight:700;margin-bottom:6px}
.cat-banner p{font-size:14px;opacity:.9;margin-bottom:14px}
.cat-products{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cat-prod{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .25s}
.cat-prod:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.cat-prod .img-wrap{height:140px;overflow:hidden;background:var(--bg)}
.cat-prod .img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.cat-prod:hover .img-wrap img{transform:scale(1.05)}
.cat-prod .info{padding:10px 12px}
.cat-prod .name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-prod .price{font-size:13px;font-weight:700;color:var(--primary);margin-top:2px}

/* === INQUIRY === */
.inquiry-section{padding:36px 0}
.inquiry-banner{background:linear-gradient(135deg,#1e40af,#3b82f6);border-radius:var(--radius-lg);padding:44px;display:grid;grid-template-columns:1fr 400px;gap:40px;align-items:center;min-height:260px;color:#fff;position:relative;overflow:hidden}
.inquiry-banner::before{content:'';position:absolute;right:-100px;top:-100px;width:400px;height:400px;background:rgba(255,255,255,.05);border-radius:50%}
.inquiry-text h2{font-size:28px;font-weight:700;margin-bottom:8px;letter-spacing:-.5px}
.inquiry-text p{opacity:.9;font-size:15px;line-height:1.6}
.inquiry-form{background:var(--white);border-radius:var(--radius);padding:24px;color:var(--text);box-shadow:var(--shadow-xl)}
.inquiry-form h4{margin-bottom:14px;font-size:16px;font-weight:700}
.inquiry-form input,.inquiry-form textarea,.inquiry-form select{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:10px;transition:border-color .2s}
.inquiry-form input:focus,.inquiry-form textarea:focus{border-color:var(--primary)}
.inquiry-form textarea{height:70px;resize:none}

/* === RECOMMENDED === */
.rec-section{padding:36px 0}
.rec-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.rec-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .25s}
.rec-card:hover{box-shadow:var(--shadow-md);transform:translateY(-3px)}
.rec-card .img-wrap{height:160px;overflow:hidden;background:var(--bg)}
.rec-card .img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.rec-card:hover .img-wrap img{transform:scale(1.05)}
.rec-card .info{padding:12px 14px}
.rec-card .price{font-size:17px;font-weight:700;margin-bottom:2px}
.rec-card .name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-card .desc{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* === SERVICES === */
.services-section{padding:36px 0}
.services-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.service-card{background:var(--white);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);transition:all .25s}
.service-card:hover{box-shadow:var(--shadow-md)}
.service-card .svc-img{height:160px;overflow:hidden;background:var(--bg)}
.service-card .svc-img img{width:100%;height:100%;object-fit:cover}
.service-card .svc-info{padding:16px;display:flex;align-items:center;gap:12px}
.service-card .svc-info h4{font-size:13px;font-weight:600;flex:1;line-height:1.4}
.service-card .svc-icon{width:40px;height:40px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.service-card .svc-icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}

/* === SUPPLIERS === */
.suppliers-section{padding:36px 0}
.suppliers-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.supplier-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:18px;text-align:center;cursor:pointer;transition:all .25s}
.supplier-card:hover{box-shadow:var(--shadow-md);border-color:var(--primary)}
.supplier-card .flag{width:48px;height:32px;border-radius:4px;overflow:hidden;margin:0 auto 8px;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.supplier-card .flag img{width:100%;height:100%;object-fit:cover}
.supplier-card .country{font-size:13px;font-weight:600}
.supplier-card .domain{font-size:11px;color:var(--text2)}

/* === NEWSLETTER === */
.newsletter{padding:48px 0;text-align:center;background:var(--white);border-top:1px solid var(--border)}
.newsletter h2{font-size:26px;font-weight:700;margin-bottom:6px}
.newsletter p{color:var(--text2);margin-bottom:20px;font-size:15px}
.newsletter-form{display:flex;max-width:480px;margin:0 auto;gap:8px}
.newsletter-form input{flex:1;padding:12px 18px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px}
.newsletter-form input:focus{border-color:var(--primary)}

/* === FOOTER === */
.footer{background:var(--white);padding:48px 0 0;border-top:1px solid var(--border)}
.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr;gap:30px}
.footer-brand p{font-size:13px;color:var(--text2);margin:10px 0 18px;line-height:1.7}
.footer-social{display:flex;gap:8px}
.footer-social a{width:34px;height:34px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:all .2s}
.footer-social a:hover{background:var(--primary);color:#fff}
.footer-social a svg{width:16px;height:16px}
.footer h5{font-size:14px;font-weight:700;margin-bottom:14px}
.footer ul{list-style:none}
.footer ul li{margin-bottom:8px}
.footer ul li a{font-size:13px;color:var(--text2);transition:color .2s}.footer ul li a:hover{color:var(--primary)}
.footer-apps{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.footer-apps button{padding:8px 16px;background:var(--text);color:#fff;border-radius:var(--radius-sm);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.footer-bottom{border-top:1px solid var(--border);padding:18px 0;margin-top:36px;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--text2)}

/* === PRODUCT LISTING === */
.plp-layout{display:grid;grid-template-columns:260px 1fr;gap:24px;padding:24px 0}
.filter-sidebar{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);padding:20px;height:fit-content;position:sticky;top:120px}
.filter-group{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.filter-group:last-child{border-bottom:none}
.filter-group h4{font-size:14px;font-weight:700;margin-bottom:10px}
.filter-group label{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;cursor:pointer;color:var(--text2)}
.filter-group label:hover{color:var(--text)}
.filter-group input[type="checkbox"],.filter-group input[type="radio"]{accent-color:var(--primary);width:16px;height:16px}
.filter-group .price-inputs{display:flex;gap:8px}
.filter-group .price-inputs input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm)}
.plp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px}
.plp-header .count{font-size:14px;color:var(--text2)}
.plp-controls{display:flex;gap:12px;align-items:center}
.plp-controls select{padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px}
.view-toggle{display:flex;gap:2px}
.view-toggle button{padding:8px 10px;border:1px solid var(--border);background:var(--white);border-radius:var(--radius-sm);transition:all .15s}
.view-toggle button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.products-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.products-grid.list-view{grid-template-columns:1fr}

/* === PRODUCT CARD === */
.p-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .25s;position:relative}
.p-card:hover{box-shadow:var(--shadow-md);transform:translateY(-3px)}
.p-card .img-wrap{height:200px;overflow:hidden;background:var(--bg);position:relative}
.p-card .img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.p-card:hover .img-wrap img{transform:scale(1.05)}
.p-card .wish-btn{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:var(--white);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;box-shadow:var(--shadow-sm);z-index:2}
.p-card .wish-btn:hover,.p-card .wish-btn.active{background:#fef2f2;border-color:var(--danger);color:var(--danger)}
.p-card .wish-btn svg{width:16px;height:16px}
.p-card .p-info{padding:14px}
.p-card .p-price{font-size:18px;font-weight:700;color:var(--primary)}
.p-card .p-old-price{font-size:13px;text-decoration:line-through;color:var(--text3);margin-left:6px}
.p-card .p-name{font-size:14px;font-weight:500;margin:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-card .p-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.p-card .p-stars{color:var(--accent)}
.p-card .p-badge{position:absolute;top:10px;left:10px;background:var(--danger);color:#fff;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700;z-index:2}
.p-card .ship-badge{font-size:11px;color:var(--success);font-weight:600}
.list-card{display:grid;grid-template-columns:220px 1fr;gap:0}
.list-card .img-wrap{height:100%;min-height:200px}

/* === PDP === */
.pdp-section{padding:24px 0}
.breadcrumb{font-size:13px;color:var(--text2);margin-bottom:16px}
.breadcrumb a{color:var(--text2)}.breadcrumb a:hover{color:var(--primary)}
.pdp-layout{display:grid;grid-template-columns:480px 1fr;gap:36px}
.pdp-gallery .main-img{width:100%;height:440px;border-radius:var(--radius);overflow:hidden;background:var(--bg);border:1px solid var(--border)}
.pdp-gallery .main-img img{width:100%;height:100%;object-fit:cover}
.pdp-gallery .thumbs{display:flex;gap:8px;margin-top:12px}
.pdp-gallery .thumb{width:64px;height:64px;border-radius:var(--radius-sm);overflow:hidden;border:2px solid var(--border);cursor:pointer;transition:border-color .2s}
.pdp-gallery .thumb:hover,.pdp-gallery .thumb.active{border-color:var(--primary)}
.pdp-gallery .thumb img{width:100%;height:100%;object-fit:cover}
.pdp-info h1{font-size:24px;font-weight:700;margin-bottom:8px;letter-spacing:-.3px}
.pdp-info .rating-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:13px;color:var(--text2)}
.pdp-info .price-block{background:var(--bg);padding:18px;border-radius:var(--radius);margin-bottom:18px;border:1px solid var(--border)}
.pdp-info .current-price{font-size:30px;font-weight:700;color:var(--primary)}
.pdp-info .old-price{font-size:16px;text-decoration:line-through;color:var(--text3);margin-left:10px}
.pdp-info .save-badge{background:#fef2f2;color:var(--danger);padding:3px 10px;border-radius:4px;font-size:12px;font-weight:600;margin-left:10px}
.pdp-info .tier-price{font-size:13px;color:var(--text2);margin-top:8px}
.pdp-opts{margin-bottom:16px}
.pdp-opts label{font-size:13px;font-weight:600;margin-bottom:8px;display:block}
.color-swatches{display:flex;gap:8px;margin-bottom:14px}
.color-swatch{width:34px;height:34px;border-radius:50%;border:2px solid var(--border);cursor:pointer;transition:all .2s}
.color-swatch:hover,.color-swatch.active{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.size-options{display:flex;gap:8px;margin-bottom:14px}
.size-btn{padding:8px 18px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--white);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
.size-btn:hover,.size-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.qty-sel{display:flex;align-items:center;margin-bottom:18px}
.qty-sel button{width:38px;height:38px;border:1px solid var(--border);background:var(--white);font-size:18px;font-weight:600;transition:all .15s}
.qty-sel button:hover{background:var(--bg)}
.qty-sel input{width:54px;height:38px;border:1px solid var(--border);border-left:none;border-right:none;text-align:center;font-weight:600}
.pdp-actions{display:flex;gap:10px;margin-bottom:20px}
.pdp-ship{background:#ecfdf5;padding:16px;border-radius:var(--radius);font-size:13px;border:1px solid #a7f3d0}
.pdp-ship p{margin-bottom:3px;color:var(--text)}

/* === CART === */
.cart-section{padding:24px 0}
.cart-layout{display:grid;grid-template-columns:1fr 380px;gap:24px}
.cart-items{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
.cart-item{display:grid;grid-template-columns:110px 1fr auto;gap:16px;padding:20px;border-bottom:1px solid var(--border);align-items:center}
.cart-item:last-child{border-bottom:none}
.cart-item-img{width:110px;height:110px;border-radius:var(--radius-sm);overflow:hidden;background:var(--bg)}
.cart-item-img img{width:100%;height:100%;object-fit:cover}
.cart-item-info h4{font-size:15px;font-weight:600;margin-bottom:4px}
.cart-item-info .variant{font-size:12px;color:var(--text2);margin-bottom:4px}
.cart-item-info .seller{font-size:12px;color:var(--text2)}
.cart-item-right{text-align:right}
.cart-item-right .price{font-size:18px;font-weight:700;margin-bottom:6px}
.order-summary{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);padding:24px;height:fit-content;position:sticky;top:120px}
.order-summary h3{font-size:18px;font-weight:700;margin-bottom:16px}
.summary-row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px}
.summary-row.total{border-top:2px solid var(--text);margin-top:8px;padding-top:14px;font-size:20px;font-weight:700}
.checkout-btn{width:100%;padding:14px;background:var(--success);color:#fff;border-radius:var(--radius);font-size:16px;font-weight:700;margin-top:16px;transition:all .2s}
.checkout-btn:hover{background:#047857}

/* === AUTH === */
.auth-section{padding:48px 0;display:flex;justify-content:center}
.auth-card{background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--border);padding:44px;width:100%;max-width:460px;box-shadow:var(--shadow-lg)}
.auth-card h2{font-size:26px;font-weight:700;margin-bottom:6px;text-align:center}
.auth-card .sub{text-align:center;color:var(--text2);margin-bottom:28px;font-size:14px}
.auth-card .fg{margin-bottom:16px}
.auth-card label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.auth-card input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);transition:border-color .2s}
.auth-card input:focus{border-color:var(--primary)}
.auth-card .btn{width:100%;padding:13px;font-size:15px;justify-content:center}
.auth-card .switch{text-align:center;margin-top:18px;font-size:13px;color:var(--text2)}
.auth-card .switch a{color:var(--primary);font-weight:600;cursor:pointer}

/* === CHECKOUT === */
.checkout-section{padding:24px 0}
.checkout-layout{display:grid;grid-template-columns:1fr 420px;gap:24px}
.checkout-form{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);padding:24px}
.checkout-form h3{font-size:18px;font-weight:700;margin-bottom:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm)}
.form-group input:focus,.form-group select:focus{border-color:var(--primary)}
.order-ok{text-align:center;padding:60px 20px}
.order-ok .check{width:80px;height:80px;border-radius:50%;background:#ecfdf5;color:var(--success);display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 20px}
.order-ok h2{font-size:28px;font-weight:700;margin-bottom:8px}
.order-ok p{color:var(--text2);margin-bottom:24px}

/* === ADMIN === */
.admin-wrap{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.admin-side{background:#0f172a;color:#fff;padding:24px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.admin-side .logo{color:#fff;padding:0 24px;margin-bottom:36px;font-size:22px}
.admin-side .logo .logo-icon{background:var(--primary)}
.admin-nav a{display:flex;align-items:center;gap:12px;padding:12px 24px;color:rgba(255,255,255,.6);font-size:14px;font-weight:500;transition:all .15s;border-left:3px solid transparent}
.admin-nav a:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.9)}
.admin-nav a.active{background:rgba(37,99,235,.15);color:#60a5fa;border-left-color:#3b82f6}
.admin-nav a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.admin-main{padding:28px;overflow-y:auto;background:var(--bg)}
.admin-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.admin-head h1{font-size:26px;font-weight:700;letter-spacing:-.3px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.stat-card{background:var(--white);border-radius:var(--radius);padding:22px;border:1px solid var(--border);transition:all .2s}
.stat-card:hover{box-shadow:var(--shadow-md)}
.stat-card .sc-icon{width:44px;height:44px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:22px}
.stat-card .sc-value{font-size:28px;font-weight:700;letter-spacing:-.5px}
.stat-card .sc-label{font-size:13px;color:var(--text2);font-weight:500;margin-top:2px}
.stat-card .sc-change{font-size:12px;font-weight:600;margin-top:4px}
.stat-card .sc-change.up{color:var(--success)}.stat-card .sc-change.down{color:var(--danger)}
.admin-table{width:100%;background:var(--white);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
.admin-table table{width:100%;border-collapse:collapse}
.admin-table th{background:var(--bg);padding:12px 16px;text-align:left;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text2)}
.admin-table td{padding:14px 16px;border-top:1px solid var(--border);font-size:13px}
.admin-table tr:hover td{background:var(--bg)}
.status-pill{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600}
.status-processing{background:#fef3c7;color:#92400e}
.status-shipped{background:#dbeafe;color:#1e40af}
.status-delivered{background:#dcfce7;color:#166534}
.status-cancelled{background:#fef2f2;color:#991b1b}
.admin-table .prod-thumb{width:36px;height:36px;border-radius:6px;object-fit:cover}

/* === PAGINATION === */
.pagination{display:flex;gap:4px;justify-content:center;padding:24px 0}
.pagination button{padding:8px 14px;border:1px solid var(--border);background:var(--white);border-radius:var(--radius-sm);font-size:13px;cursor:pointer;font-weight:500}
.pagination button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pagination button:hover:not(.active){background:var(--bg)}

/* === TOAST === */
.toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;padding:14px 24px;border-radius:var(--radius);z-index:300;font-size:14px;font-weight:500;animation:slideIn .3s ease;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* === RESPONSIVE === */
@media(max-width:1024px){
  .hero{grid-template-columns:1fr;height:auto}.hero-sidebar{display:none}.hero-right{display:none}.hero-slider{display:none}
  .hero-content{max-width:100%}.hero-bg{opacity:.7}
  .deals-grid{grid-template-columns:repeat(3,1fr)}.cat-section .cat-layout{grid-template-columns:1fr}.cat-banner{display:none}
  .cat-products{grid-template-columns:repeat(3,1fr)}.rec-grid{grid-template-columns:repeat(3,1fr)}
  .services-grid{grid-template-columns:repeat(2,1fr)}.suppliers-grid{grid-template-columns:repeat(3,1fr)}
  .footer-grid{grid-template-columns:repeat(3,1fr)}.plp-layout{grid-template-columns:1fr}.filter-sidebar{display:none}
  .products-grid{grid-template-columns:repeat(2,1fr)}.pdp-layout{grid-template-columns:1fr}
  .cart-layout{grid-template-columns:1fr}.checkout-layout{grid-template-columns:1fr}
  .admin-wrap{grid-template-columns:1fr}.admin-side{display:none}
  .inquiry-banner{grid-template-columns:1fr}.top-bar{display:none}
}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}
.modal{background:white;border-radius:12px;padding:24px;max-width:500px;width:90%;max-height:90vh;overflow-y:auto;animation:slideUp .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal h3{font-size:20px;font-weight:700;margin-bottom:20px}
.modal .form-group{margin-bottom:16px}
.modal label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:var(--text2)}
.modal input,.modal select,.modal textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;font-size:14px}
.modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:var(--primary)}
  </style>
</head>
<body>
<div id="app"></div>
<script>
// ===== STATE =====
const S = {
  user: JSON.parse(localStorage.getItem('user')) || null,
  cart: JSON.parse(localStorage.getItem('cart')) || [],
  wish: JSON.parse(localStorage.getItem('wish')) || [],
  view: 'home', params: {}, adminView: 'dashboard'
};
const saveCart = () => localStorage.setItem('cart', JSON.stringify(S.cart));
const saveWish = () => localStorage.setItem('wish', JSON.stringify(S.wish));
const saveUser = () => localStorage.setItem('user', JSON.stringify(S.user));

// ===== API =====
const api = {
  get: async u => (await fetch(u)).json(),
  post: async (u,d) => (await fetch(u, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})).json(),
  put: async (u,d) => (await fetch(u, {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})).json(),
  del: async u => (await fetch(u, {method:'DELETE'})).json()
};

// ===== UTILS =====
const formatPrice = p => '$' + parseFloat(p).toFixed(2);
function showToast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = '✓ ' + msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
}
function getStars(r) { const n = Math.round(parseFloat(r)); let s = ''; for(let i=1;i<=5;i++) s += i<=n?'★':'☆'; return s; }
function flagUrl(code) { return `https://flagcdn.com/w80/${code}.png`; }

// ===== ICONS (SVG) =====
const ICO = {
  search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>',
  user: '<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  heart: '<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
  cart: '<svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>',
  msg: '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  grid: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>',
  list: '<svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>',
  dash: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>',
  pkg: '<svg viewBox="0 0 24 24"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>',
  tag: '<svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>',
  users: '<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  searchI: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>',
  file: '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
  truck: '<svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>',
  shield: '<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
  globe: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
  zap: '<svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
};

// ===== NAVIGATION =====
function nav(page, params={}) {
  S.view = page; S.params = params;
  const h = page==='home'?'':page+(params.id?'/'+params.id:'')+(params.category?'/'+params.category:'')+(params.country?'/'+params.country:'');
  window.location.hash = h;
  render(); window.scrollTo(0,0);
}
window.addEventListener('hashchange', () => {
  const h = window.location.hash.slice(1);
  if(!h||h===''){S.view='home';}
  else if(h.startsWith('product/')){S.view='product';S.params={id:parseInt(h.split('/')[1])};}
  else if(h.startsWith('category/')){S.view='category';S.params={category:h.split('/')[1]};}
  else if(h.startsWith('country/')){S.view='country';S.params={country:h.split('/')[1]};}
  else if(h==='cart')S.view='cart';
  else if(h==='checkout')S.view='checkout';
  else if(h==='login')S.view='login';
  else if(h==='register')S.view='register';
  else if(h==='order-success')S.view='order-success';
  else if(h.startsWith('admin')){S.view='admin';S.adminView=h.split('/')[1]||'dashboard';}
  else S.view='home';
  render();
});

// ===== RENDER HEADER =====
function renderHeader() {
  const cc = S.cart.reduce((s,i)=>s+i.quantity,0);
  return `
  <div class="top-bar">
    <div class="container">
      <span>Free shipping on orders over $50 | Worldwide delivery available</span>
      <div class="top-bar-right">
        ${S.user?.role==='admin'?'<a href="#admin/dashboard" onclick="nav(\'admin\')">Admin Panel</a>':''}
        <a href="#" onclick="event.preventDefault()">Help Center</a>
        <span>🌐 English | USD</span>
      </div>
    </div>
  </div>
  <header class="header">
    <div class="container header-main">
      <div class="logo" onclick="nav('home')">
        <svg width="38" height="38" viewBox="0 0 38 38"><rect width="38" height="38" rx="8" fill="#2563eb"/><text x="19" y="26" text-anchor="middle" fill="#fff" font-size="20" font-weight="700" font-family="DM Sans">B</text></svg>
        <span>Brand</span>
      </div>
      <div class="search-wrap">
        <div class="search-bar">
          <select id="search-cat"><option value="">All Categories</option></select>
          <input type="text" id="search-input" placeholder="Search products, brands and more..." onkeydown="if(event.key==='Enter')doSearch()">
          <button onclick="doSearch()">${ICO.search}</button>
        </div>
      </div>
      <div class="header-actions">
        <div class="header-action" onclick="nav('home')">
          ${ICO.msg}<span>Messages</span>
        </div>
        <div class="header-action" onclick="nav('home')">
          ${ICO.heart}<span>Wishlist</span>
          ${S.wish.length?`<span class="notif">${S.wish.length}</span>`:''}
        </div>
        <div class="header-action" onclick="nav('cart')">
          ${ICO.cart}<span>Cart</span>
          ${cc?`<span class="notif">${cc}</span>`:''}
        </div>
        <div class="header-action" onclick="${S.user?"nav('home')":"nav('login')"}">
          ${ICO.user}<span>${S.user?S.user.name.split(' ')[0]:'Account'}</span>
        </div>
      </div>
    </div>
    <nav class="nav-bar">
      <div class="container">
        <div class="nav-links">
          <a href="#home" class="cat-link" onclick="nav('home')">☰ All Categories</a>
          <a href="#" onclick="event.preventDefault();nav('category',{category:'electronics'})">Hot Offers</a>
          <a href="#" onclick="event.preventDefault();nav('category',{category:'home'})">Gift Boxes</a>
          <a href="#" onclick="event.preventDefault();nav('category',{category:'tools'})">Projects</a>
          <a href="#" onclick="event.preventDefault();nav('category',{category:'clothing'})">Fashion</a>
          <a href="#" onclick="event.preventDefault();showToast('Help Center coming soon!')">Help</a>
        </div>
        <div class="nav-right">
          <span>English</span>
          <span>📍 Ship to Germany</span>
        </div>
      </div>
    </nav>
  </header>`;
}

// ===== RENDER FOOTER =====
function renderFooter() {
  return `
  <div class="newsletter">
    <div class="container">

function pCard(p, list=false) {
  return `

    <div class="img-wrap">
      <img src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&h=400&fit=crop'">
      ${p.discount?`<span class="p-badge">-${p.discount}%</span>`:''}

        <svg viewBox="0 0 24 24" fill="${S.wish.includes(p.id)?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </div>
    </div>
    <div class="p-info">
      <div>
        <span class="p-price">${formatPrice(p.price)}</span>

  </div>`;
}

function renderCart() {
  if(!S.cart.length) return `${renderHeader()}<main class="container" style="padding:60px 0;text-align:center"><div style="font-size:60px;margin-bottom:16px">🛒</div><h2>Your cart is empty</h2><p style="color:var(--text2);margin:8px 0 24px">Add some items to get started</p><button class="btn btn-primary" onclick="nav('home')">Continue Shopping</button></main>${renderFooter()}`;
  const sub = S.cart.reduce((s,i)=>s+i.price*i.quantity,0);
  const disc = sub>200?10:0;
  const tax = Math.round(sub*.05*100)/100;
  const ship = sub>50?0:9.99;
  const total = Math.round((sub-disc+tax+ship)*100)/100;
  return `
  ${renderHeader()}
  <main class="container cart-section">
    <h2 style="font-size:24px;font-weight:700;margin-bottom:20px">My Cart (${S.cart.reduce((s,i)=>s+i.quantity,0)})</h2>
    <div class="cart-layout">
      <div>
        <div class="cart-items">
          ${S.cart.map((item,idx)=>`
            <div class="cart-item">
              <div class="cart-item-img"><img src="${item.image||item.emoji||'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=200&h=200&fit=crop'}" alt="" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=200&h=200&fit=crop'"></div>
              <div class="cart-item-info">
                <h4>${item.name}</h4>
                <div class="variant">${item.variant||''}</div>
                <div class="seller">Seller: ${item.seller||'Marketplace'}</div>
                <div style="margin-top:8px;display:flex;align-items:center;gap:8px">
                  <button class="btn btn-sm btn-outline" onclick="updQty(${idx},-1)">−</button>
                  <span style="font-weight:600;min-width:20px;text-align:center">${item.quantity}</span>
                  <button class="btn btn-sm btn-outline" onclick="updQty(${idx},1)">+</button>
                </div>
              </div>
              <div class="cart-item-right">
                <div class="price">${formatPrice(item.price*item.quantity)}</div>
                <div style="font-size:12px;color:var(--text2)">${formatPrice(item.price)} each</div>
                <div style="margin-top:8px;font-size:12px"><a onclick="rmCart(${idx})" style="color:var(--danger);cursor:pointer">Remove</a> · <a onclick="saveLater(${idx})" style="color:var(--text2);cursor:pointer">Save for later</a></div>
              </div>
            </div>
          `).join('')}
        </div>
        <div style="display:flex;gap:12px;margin-top:16px">
          <button class="btn btn-primary" onclick="nav('home')">Back to shop</button>
          <button class="btn btn-outline" onclick="S.cart=[];saveCart();render()">Remove all</button>
        </div>
      </div>
      <div class="order-summary">
        <h3>Order Summary</h3>
        <div class="coupon-input" style="display:flex;gap:8px;margin-bottom:16px"><input type="text" placeholder="Coupon code" id="coupon" style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm)"><button class="btn btn-sm btn-outline" onclick="showToast('Coupon applied!')">Apply</button></div>
        <div class="summary-row"><span>Subtotal</span><span>${formatPrice(sub)}</span></div>
        ${disc>0?`<div class="summary-row" style="color:var(--success)"><span>Discount</span><span>-${formatPrice(disc)}</span></div>`:''}
        <div class="summary-row"><span>Tax</span><span>+${formatPrice(tax)}</span></div>
        <div class="summary-row"><span>Shipping</span><span>${ship===0?'Free':formatPrice(ship)}</span></div>

      </div>

  </main>${renderFooter()}`;

/* ACTIONS_JS */
function doSearch() {
  const q = document.getElementById('search-input')?.value;

}
async function searchRender(q) {
  const {products} = await api.get(`/api/products?search=${encodeURIComponent(q)}&limit=20`);
  const html = `${renderHeader()}<main class="container" style="padding:24px 0"><h2 class="section-title">Search results for "${q}" (${products.length})</h2><div class="products-grid" id="pcontainer">${products.map(p=>pCard(p)).join('')}</div></main>${renderFooter()}`;
  document.getElementById('app').innerHTML = html;
}
async function sortProducts(sort) {
  const cat = S.params.category||'';
  const url = `/api/products?category=${cat}&sort=${sort}&limit=20`;
  const {products} = await api.get(url);
  const c = document.getElementById('pcontainer');
  if(c) c.innerHTML = products.map(p=>pCard(p)).join('');
}
function applyFilters() {
  const min = document.getElementById('f-min')?.value;
  const max = document.getElementById('f-max')?.value;
  const vf = document.getElementById('vf')?.checked;
  const cat = S.params.category||'';
  let url = `/api/products?category=${cat}&limit=20`;
  if(min) url += `&minPrice=${min}`;
  if(max) url += `&maxPrice=${max}`;
  if(vf) url += `&verified=true`;
  api.get(url).then(({products})=>{
    const c = document.getElementById('pcontainer');
    if(c) c.innerHTML = products.map(p=>pCard(p)).join('');
  });
}
function toggleView(mode, btn) {

}
function selectSwatch(el) { document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('active')); el.classList.add('active'); }

function chgQty(d) { const i = document.getElementById('pqty'); let v = parseInt(i.value)+d; if(v<1) v=1; i.value=v; }

  document.querySelectorAll('.tab-btn').forEach(b=>{b.style.borderBottomColor='transparent';b.style.color='var(--text2)'});
  btn.style.borderBottomColor='var(--primary)';btn.style.color='var(--primary)';
  ['desc','specs','reviews'].forEach(x=>{const e=document.getElementById('tab-'+x);if(e)e.style.display=x===id?'block':'none';});
}
async function addCart(pid) {
  const {product:p} = await api.get(`/api/products/${pid}`);
  const qty = parseInt(document.getElementById('pqty')?.value||1);
  const ex = S.cart.find(i=>i.productId===pid);
  if(ex) ex.quantity += qty;
  else S.cart.push({productId:pid,name:p.name,price:p.price,quantity:qty,image:p.image,variant:`Color: ${p.colors[0]}, Size: ${p.sizes[0]}`,seller:p.supplier});
  saveCart(); showToast(`Added ${qty}x ${p.name} to cart!`); render();
}
function buyNow(pid) { addCart(pid); setTimeout(()=>nav('checkout'),500); }
function updQty(idx,d) { S.cart[idx].quantity+=d; if(S.cart[idx].quantity<1)S.cart.splice(idx,1); saveCart(); render(); }
function rmCart(idx) { S.cart.splice(idx,1); saveCart(); render(); }
function saveLater(idx) {
  const item = S.cart[idx];
  if(!S.wish.includes(item.productId)) S.wish.push(item.productId);
  S.cart.splice(idx,1); saveCart(); saveWish(); showToast('Saved for later'); render();
}
function toggleWish(pid) {
  const idx = S.wish.indexOf(pid);
  if(idx>=0){S.wish.splice(idx,1);showToast('Removed from wishlist');}
  else{S.wish.push(pid);showToast('Added to wishlist');}
  saveWish(); render();
}

  const email = document.getElementById('l-email').value;
  const pass = document.getElementById('l-pass').value;
  if(!email||!pass){document.getElementById('login-err').style.display='block';document.getElementById('login-err').textContent='Please fill in all fields';return;}
  const r = await api.post('/api/auth/login',{email,password:pass});
  if(r.error){document.getElementById('login-err').style.display='block';document.getElementById('login-err').textContent=r.error;}
  else{S.user=r.user;saveUser();showToast('Logged in successfully!');nav('home');}
}
async function doRegister() {
  const name=document.getElementById('r-name').value,email=document.getElementById('r-email').value,pass=document.getElementById('r-pass').value,conf=document.getElementById('r-confirm').value;
  const err=document.getElementById('reg-err');
  if(!name||!email||!pass){err.style.display='block';err.textContent='Please fill in all fields';return;}
  if(pass!==conf){err.style.display='block';err.textContent='Passwords do not match';return;}
  if(pass.length<6){err.style.display='block';err.textContent='Password must be at least 6 characters';return;}
  const r=await api.post('/api/auth/register',{name,email,password:pass});
  if(r.error){err.style.display='block';err.textContent=r.error;}
  else{S.user=r.user;saveUser();showToast('Account created!');nav('home');}
}
async function placeOrder(total) {
  const addr = `${document.getElementById('co-fn')?.value} ${document.getElementById('co-ln')?.value}, ${document.getElementById('co-addr')?.value}, ${document.getElementById('co-city')?.value}`;
  const pay = document.querySelector('input[name="pay"]:checked')?.value || 'card';
  const payNames = {card:'Credit Card',paypal:'PayPal',cod:'Cash on Delivery'};
  const order = await api.post('/api/orders',{
    userId:S.user?.id||1,
    items:S.cart.map(i=>({productId:i.productId,name:i.name,quantity:i.quantity,price:i.price,image:i.image})),
    total, address:addr, paymentMethod:payNames[pay]||'Credit Card'
  });
  localStorage.setItem('lastOrderId',order.id);
  S.cart=[];saveCart();showToast('Order placed successfully!');nav('order-success');
}
// Admin: Add new product
async function addProduct() {
  const name = document.getElementById('p-name').value;
  const category = document.getElementById('p-category').value;
  const price = document.getElementById('p-price').value;
  const description = document.getElementById('p-desc').value;
  const image = document.getElementById('p-image').value;

  if (!name || !category || !price) {
    showToast('Please fill all required fields');
    return;
  }

  try {
    await api.post('/api/admin/products', { name, category, price, description, image });
    showToast('Product added successfully!');
    hideModal();
    render();
  } catch (err) {
    showToast('Error adding product');
  }
}

// Admin: Delete product
async function deleteProduct(id) {
  if (!confirm('Are you sure you want to delete this product?')) return;
  try {
    await api.del(`/api/admin/products/${id}`);
    showToast('Product deleted');
    render();
  } catch (err) {
    showToast('Error deleting product');
  }
}

/* INIT_JS */
async function render() {
  const app = document.getElementById('app');
  let html = '';
  switch(S.view) {
    case 'home': html = await renderHome(); break;
    case 'category': html = await renderCategory(); break;
    case 'country': html = await renderCountry(); break;
    case 'product': html = await renderProduct(); break;
    case 'cart': html = renderCart(); break;
    case 'login': html = renderLogin(); break;
    case 'register': html = renderRegister(); break;
    case 'checkout': html = renderCheckout(); break;
    case 'order-success': html = renderOrderOk(); break;
    case 'admin': html = await renderAdmin(); break;
    default: html = await renderHome();
  }
  app.innerHTML = html;
  startCD();
  if(S.view === 'home') startHeroSlider();
}
let cdInterval;
function startCD() {
  if(cdInterval) clearInterval(cdInterval);
  let t = 4*86400+13*3600+34*60+56;
  cdInterval = setInterval(()=>{
    t--;if(t<0)t=5*86400;
    const d=Math.floor(t/86400),h=Math.floor(t%86400/3600),m=Math.floor(t%3600/60),s=t%60;
    const de=document.getElementById('cd-d'),he=document.getElementById('cd-h'),me=document.getElementById('cd-m'),se=document.getElementById('cd-s');
    if(de)de.textContent=String(d).padStart(2,'0');
    if(he)he.textContent=String(h).padStart(2,'0');
    if(me)me.textContent=String(m).padStart(2,'0');
    if(se)se.textContent=String(s).padStart(2,'0');
  },1000);
}

// Hero Slider Auto-Rotation
let heroInterval;
function startHeroSlider() {
  if(heroInterval) clearInterval(heroInterval);
  let currentSlide = 0;
  const slides = document.querySelectorAll('.hero-slide');
  const dots = document.querySelectorAll('.hero-dots span');
  if(slides.length === 0) return;

  function showSlide(n) {
    slides.forEach(s => s.classList.remove('active'));
    dots.forEach(d => d.classList.remove('active'));
    currentSlide = (n + slides.length) % slides.length;
    slides[currentSlide].classList.add('active');
    if(dots[currentSlide]) dots[currentSlide].classList.add('active');
  }

  heroInterval = setInterval(() => showSlide(currentSlide + 1), 3000);
}

function goSlide(n) {
  const slides = document.querySelectorAll('.hero-slide');
  const dots = document.querySelectorAll('.hero-dots span');
  if(slides.length === 0) return;
  if(heroInterval) clearInterval(heroInterval);
  slides.forEach(s => s.classList.remove('active'));
  dots.forEach(d => d.classList.remove('active'));
  slides[n].classList.add('active');
  if(dots[n]) dots[n].classList.add('active');
  heroInterval = setInterval(() => {
    const next = (n + 1) % slides.length;
    slides.forEach(s => s.classList.remove('active'));
    dots.forEach(d => d.classList.remove('active'));
    slides[next].classList.add('active');
    if(dots[next]) dots[next].classList.add('active');
    n = next;
  }, 3000);
}
function boot() {
  const h = window.location.hash.slice(1);
  if(h.startsWith('product/')){S.view='product';S.params={id:parseInt(h.split('/')[1])};}
  else if(h.startsWith('category/')){S.view='category';S.params={category:h.split('/')[1]};}
  else if(h.startsWith('country/')){S.view='country';S.params={country:h.split('/')[1]};}
  else if(h==='cart')S.view='cart';
  else if(h==='checkout')S.view='checkout';
  else if(h==='login')S.view='login';
  else if(h==='register')S.view='register';
  else if(h==='order-success')S.view='order-success';
  else if(h.startsWith('admin')){S.view='admin';S.adminView=h.split('/')[1]||'dashboard';}
  else S.view='home';
  render();
}
boot();
